name: PR2862 Native macOS Endpoint Diagnostics
run-name: PR2862 macOS endpoint ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public repository containing the exact fixed PR source
        required: true
        type: string
      source_sha:
        description: Full immutable fixed PR commit SHA
        required: true
        type: string
      regression_filter:
        description: GoogleTest name/filter for the new repair regression; must select at least one case
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr2862-native-macos-endpoint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remote-endpoint:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      REGRESSION_FILTER: ${{ inputs.regression_filter }}
    steps:
      - name: Validate immutable source selection
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "$REGRESSION_FILTER"

      - name: Checkout the fixed PR source
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install native CMake and GoogleTest dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          command -v cmake >/dev/null 2>&1 || packages+=(cmake)
          command -v ninja >/dev/null 2>&1 || packages+=(ninja)
          brew list --versions googletest >/dev/null 2>&1 || packages+=(googletest)
          if (( ${#packages[@]} )); then brew install "${packages[@]}"; fi

      - name: Configure and build only the endpoint target
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/endpoint-evidence"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          {
            printf 'source_repository=%s\nsource_sha=%s\n' "$SOURCE_REPOSITORY" "$SOURCE_SHA"
            printf 'workflow_sha=%s\nrunner_os=%s\nrunner_arch=%s\n' "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH"
            git status --porcelain
            sw_vers
            /usr/bin/c++ --version
            cmake --version
            python --version
            brew list --versions googletest
          } | tee "$RUNNER_TEMP/endpoint-evidence/identity.txt"
          python -m venv --system-site-packages .venv
          export PYTHONPATH="$PWD/python:$PWD"
          .venv/bin/python -c 'from simpler_setup.pto_isa import ensure_pto_isa_root; print(ensure_pto_isa_root())' \
            | tee "$RUNNER_TEMP/endpoint-evidence/pto-isa-root.txt"
          cmake -S tests/ut/cpp -B "$RUNNER_TEMP/endpoint-build" -G Ninja \
            -DCMAKE_CXX_COMPILER=/usr/bin/c++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python" \
            -DSIMPLER_ENABLE_HARDWARE_TESTS=OFF \
            2>&1 | tee "$RUNNER_TEMP/endpoint-evidence/configure.log"
          cmake --build "$RUNNER_TEMP/endpoint-build" --target test_remote_endpoint --parallel 4 \
            2>&1 | tee "$RUNNER_TEMP/endpoint-evidence/build.log"
          cp "$RUNNER_TEMP/endpoint-build/CMakeCache.txt" "$RUNNER_TEMP/endpoint-evidence/"
          cp "$RUNNER_TEMP/endpoint-build/compile_commands.json" "$RUNNER_TEMP/endpoint-evidence/"
          shasum -a 256 "$RUNNER_TEMP/endpoint-build/test_remote_endpoint" \
            | tee "$RUNNER_TEMP/endpoint-evidence/binary-sha256.txt"

      - name: Run the full target and repeated regression cases
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          build = Path(os.environ['RUNNER_TEMP']) / 'endpoint-build'
          evidence = Path(os.environ['RUNNER_TEMP']) / 'endpoint-evidence'
          binary = str(build / 'test_remote_endpoint')
          original = 'MpiGroupMailboxChannel.GroupArrivalTimeoutFailsTaskWithoutKillingGroup'
          regression = os.environ['REGRESSION_FILTER']

          def selected(filter_value):
              output = subprocess.check_output(
                  [binary, '--gtest_list_tests', '--gtest_filter=' + filter_value], text=True, timeout=30)
              suite = ''
              names = []
              for line in output.splitlines():
                  plain = line.split('#', 1)[0].rstrip()
                  if plain.endswith('.') and not plain.startswith(' '):
                      suite = plain
                  elif suite and plain.startswith('  ') and plain.strip():
                      names.append(suite + plain.strip())
              return names

          cases = {'all': selected('*'), 'original': selected(original), 'regression': selected(regression)}
          (evidence / 'selected-cases.json').write_text(json.dumps(cases, indent=2) + '\n')
          assert len(cases['all']) >= 27, cases
          assert cases['original'] == [original], cases
          assert cases['regression'], 'The regression filter selected no tests'

          def run(name, command):
              log = evidence / (name + '.log')
              print('RUN', command, flush=True)
              with log.open('w') as output:
                  result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT, timeout=180)
              print(log.read_text(), flush=True)
              assert result.returncode == 0, f'{name} failed: {result.returncode}'

          run('full-target', ['ctest', '--test-dir', str(build), '-R', '^test_remote_endpoint$',
                              '--output-on-failure', '--timeout', '120', '-V'])
          run('original-repeat20', [binary, '--gtest_filter=' + original, '--gtest_repeat=20'])
          run('regression-repeat20', [binary, '--gtest_filter=' + regression, '--gtest_repeat=20'])
          (evidence / 'PASS.txt').write_text('Full target, original x20, regression x20 passed\n')
          PY

      - name: Upload native macOS diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2862-macos-endpoint-${{ inputs.source_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/endpoint-evidence
          if-no-files-found: warn
